<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu AI</title>
    <style>
        .container {
            width: 400px;
            height: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        h1 {
            margin: 40px;
        }

        input {
            margin: 10px;
        }

        a {
            text-decoration: none;
            color: black;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ASK TO AI</h1>
        <input type="text" id="question" placeholder="Tuliskan pertanyaan mu">
        <button onclick="kirim()">Tanya</button>

        <p id="hasil"></p>
    </div>
    <div class="data">
        <table border="1">
            <thead>
                <tr>
                    <th>id</th>
                    <th>nama</th>
                    <th>telepon</th>
                    <th>email</th>
                    <th>aksi</th>
                </tr>
            </thead>
            <tbody id="dataBody">
             <!--data disini-->   
            </tbody>
        </table>
    </div>

    <script src="js/menu.js"></script>
</body>
</html>
